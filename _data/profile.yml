short_bio: |-
  <p>
    I am Huimin Guo, a Ph.D. student at Northeastern University, China.
  </p> <p>
    My research focuses on AI-driven medical image analysis and segmentation across multi-modal imaging data (including CT, X-ray, and endoscopy). I develop deep learning algorithms for automated lesion detection and radiotherapy target volume delineation (such as in esophageal cancer) to enhance precision in clinical workflows.
  </p>
